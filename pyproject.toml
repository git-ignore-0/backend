[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nfv-core-auth"
version = "0.1.0"
description = "Natural Farming Vietnam central identity and OAuth2 service"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.2.17,<5.3",
    "cryptography>=50.0.0,<51",
    "django-allauth>=65,<66",
    "django-oauth-toolkit>=3.0,<4",
    "djangorestframework>=3.17.2,<3.18",
    "gunicorn>=23,<24",
    "oauthlib>=4.0.0,<5",
    "Pillow>=12.3,<13",
    "python-dotenv>=1.1,<2",
    "reportlab>=4.4,<5",
    "requests>=2.32,<3",
    "sqlparse>=0.6.0,<0.7",
    "urllib3>=2.8.0,<3",
    "whitenoise>=6.8,<7",
]

[project.optional-dependencies]
mysql = ["mysql-connector-python>=9.5,<10"]
dev = [
    "polib>=1.2,<2",
    "pytest>=9.0.3,<10",
    "pytest-django>=4.10,<5",
    "pytest-cov>=6,<7",
    "pypdf>=6,<7",
    "ruff>=0.11,<1",
    "pip-audit>=2.9,<3",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["DJ001"]

[tool.setuptools.packages.find]
include = ["config*", "content*", "identity*", "members*", "referrals*", "memberships*"]
