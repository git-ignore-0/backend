name: Deploy Backend test

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-test-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade 'pip>=26.2' 'setuptools>=84.1.0'
          .venv/bin/python -m pip install -e '.[dev,mysql]'
      - name: Quality gate
        run: |
          .venv/bin/ruff format --check config content identity scripts tests manage.py passenger_wsgi.py
          .venv/bin/ruff check .
          .venv/bin/python manage.py makemigrations --check
          .venv/bin/python manage.py check
          .venv/bin/pytest -W error
          .venv/bin/pip-audit
          bash -n scripts/deploy-test-ftps.sh tests/deploy-test-ftps.test.sh
          bash tests/deploy-test-ftps.test.sh
      - name: Archive backend source from commit
        run: |
          git archive --format=zip --output backend-release.zip HEAD
          unzip -tq backend-release.zip
          unzip -l backend-release.zip
          sha256sum backend-release.zip
      - name: Install FTPS client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lftp
      - name: Upload and deploy Backend test
        env:
          TEST_FTP_SERVER: ${{ secrets.TEST_FTP_SERVER }}
          TEST_FTP_USERNAME: ${{ secrets.TEST_FTP_USERNAME }}
          TEST_FTP_PASSWORD: ${{ secrets.TEST_FTP_PASSWORD }}
        run: bash scripts/deploy-test-ftps.sh
      - name: Smoke test Backend test
        run: |
          for endpoint in \
            '/health' \
            '/api/v1/public/site-settings?locale=vi' \
            '/api/v1/public/workshops?locale=vi&period=upcoming&page=1&page_size=1'
          do
            curl --fail --silent --show-error --retry 6 --retry-delay 10 \
              --retry-all-errors --max-time 30 \
              "https://auth-test.naturalfarmingvietnam.com$endpoint"
          done
