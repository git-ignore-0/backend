{% extends "base.html" %}
{% block title %}Tạo tài khoản{% endblock %}
{% block content %}
<section class="card">
    <p class="eyebrow">Tài khoản dùng chung</p>
    <h1>Tạo tài khoản</h1>
    <p>Sau khi đăng ký, hãy xác minh email trước khi sử dụng website và diễn đàn.</p>
    <form method="post" action="{% url 'account_signup' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Đăng ký</button>
    </form>
    <div class="links"><a href="/login">Đã có tài khoản?</a></div>
</section>
{% endblock %}
