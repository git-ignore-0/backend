{% extends "base.html" %}
{% block title %}Mật khẩu mới{% endblock %}
{% block content %}
<section class="card">
    <h1>Tạo mật khẩu mới</h1>
    {% if token_fail %}
        <p>Liên kết đặt lại mật khẩu không hợp lệ hoặc đã hết hạn.</p>
    {% else %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Lưu mật khẩu</button>
        </form>
    {% endif %}
</section>
{% endblock %}
