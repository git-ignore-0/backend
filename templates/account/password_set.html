{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "Set password" %}{% endblock %}
{% block content %}
<section class="card">
    <a class="card-back" href="{% url 'account' %}">← {% translate "Back to account" %}</a>
    <p class="eyebrow">{% translate "Account security" %}</p>
    <h1>{% translate "Set password" %}</h1>
    <form method="post" action="{% url 'account_set_password' %}">
        {% csrf_token %}
        {{ form.as_p }}
        {{ redirect_field }}
        <button type="submit">{% translate "Set password" %}</button>
    </form>
</section>
{% endblock %}
