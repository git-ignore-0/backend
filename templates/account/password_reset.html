{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "Forgot password" %}{% endblock %}
{% block content %}
<section class="card">
    <h1>{% translate "Reset your password" %}</h1>
    <p>{% translate "Enter your email and we will send you a password reset link." %}</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">{% translate "Send reset link" %}</button>
    </form>
</section>
{% endblock %}
