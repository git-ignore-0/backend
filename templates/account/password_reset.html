{% extends "base.html" %}
{% block title %}Quên mật khẩu{% endblock %}
{% block content %}
<section class="card">
    <h1>Đặt lại mật khẩu</h1>
    <p>Nhập email và chúng tôi sẽ gửi liên kết đặt lại mật khẩu.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Gửi liên kết</button>
    </form>
</section>
{% endblock %}
