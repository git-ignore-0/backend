{% load static %}
{% if messages %}
    <script src="{% static 'js/vendor/alpine-3.14.8.min.js' %}" defer></script>
    <div class="auth-toast-stack">
        {% for message in messages %}
            {% if message.level >= 30 %}
                <c-toast id="auth-toast-{{ forloop.counter }}" class="auth-toast" role="alert" auto_show="true">
                    <c-toast.content type="destructive" :description="message" />
                </c-toast>
            {% else %}
                <c-toast id="auth-toast-{{ forloop.counter }}" class="auth-toast" auto_show="true" :dismissal="message.extra_tags">
                    <c-toast.content :description="message" />
                </c-toast>
            {% endif %}
        {% endfor %}
    </div>
{% endif %}
