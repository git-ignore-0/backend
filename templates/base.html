{% load static %}
<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Tài khoản NFV{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body>
    <main class="shell">
        <a class="brand" href="/">Natural Farming Vietnam</a>
        {% if messages %}
            <div class="messages" role="status">
                {% for message in messages %}<p>{{ message }}</p>{% endfor %}
            </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
